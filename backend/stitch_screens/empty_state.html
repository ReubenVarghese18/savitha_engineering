<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f94706",
                        "background-light": "#f8f6f5",
                        "background-dark": "#23140f",
                        "ledger-black": "#0A0A0A",
                        "ledger-white": "#FFFFFF",

                        "ledger-muted": "#737373",

                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"],
                        "mono": ["IBM Plex Mono", "monospace"]

                    borderRadius: {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem",
                        "none": "0px"
                    },
                    animation: {
                        'scanline': 'scan 4s linear infinite',
                        'bracket-pulse': 'bracket-pulse 2s ease-in-out infinite',
                        'pulse-industrial': 'pulse-glow 4s steps(1) infinite',
                        'arrow-snap': 'arrow-snap 0.2s steps(1) forwards'
                    },
                    keyframes: {
                        scan: {
                            '0%': { top: '0%', opacity: '0' },
                            '5%': { opacity: '1' },
                            '95%': { opacity: '1' },
                            '100%': { top: '100%', opacity: '0' }
                        },
                        'bracket-pulse': {
                            '0%, 100%': { transform: 'scale(1)', opacity: '0.8' },
                            '50%': { transform: 'scale(1.05)', opacity: '1' }
                        },
                        'pulse-glow': {
                            '0%, 100%': { opacity: '0.1', transform: 'scale(0.95)' },
                            '50%': { opacity: '0.25', transform: 'scale(1.05)' }
                        },
                        'arrow-snap': {
                            '0%': { transform: 'translateX(0)' },
                            '100%': { transform: 'translateX(4px)' }
                        }
                    }
                },
            },
        }
