name: savitha-prod

# Production stack: HTTPS front door (Caddy) + website + API + database.
# Usage:  cp .env.production.example .env.production   (fill it in), then
#         docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: savitha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: savitha
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U savitha"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://savitha:${POSTGRES_PASSWORD}@db:5432/savitha
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      CORS_ORIGINS: https://${DOMAIN}
      SITE_URL: https://${DOMAIN}
      ENABLE_HSTS: "false"  # Caddy adds the HSTS header for the whole site
      ENVIRONMENT: production
      SENTRY_DSN: ${SENTRY_DSN:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      QUOTE_ALERT_TO: ${QUOTE_ALERT_TO:-}

  backup:
    image: postgres:16
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: Asia/Kolkata
    volumes:
      - ./deploy/run-backups.sh:/run-backups.sh:ro
      - ./backups:/backups
    entrypoint: ["sh", "/run-backups.sh"]

  frontend:
    build:
      context: ./frontend
      args:
        # Same domain as the site: Caddy sends /api/* to the backend.
        VITE_API_URL: https://${DOMAIN}
    restart: unless-stopped

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
